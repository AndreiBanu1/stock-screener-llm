[project]
name = "stock-screener-llm"
version = "0.1.0"
description = "AI-powered stock screener using LangGraph, Ollama, and Yahoo Finance"
readme = "README.md"
authors = [
    { name = "Andrei Banu" }
]
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "langchain>=1.3.15",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "yfinance>=1.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.uv]
package = false

